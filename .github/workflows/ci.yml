name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code linter (oxlint)
        run: npm run lint

      - name: Run unit & regression test suites
        run: npm test

      - name: Run headless automator test
        run: npm run test:sim

      - name: Run miniprogram-simulate E2E component test
        run: npm run test:simulate
