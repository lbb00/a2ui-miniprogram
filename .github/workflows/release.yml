name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Permissions required for Changesets PR management and npm OIDC Trusted Publishing
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release & Publish
    environment: a2ui-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Ensure modern npm for OIDC
        run: |
          npm install -g npm@latest
          node --version
          npm --version
          npm config get registry
          npm config get dry-run

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Verify published version is publicly available
        if: steps.changesets.outputs['has-changesets'] != 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { name, version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (let attempt = 1; attempt <= 12; attempt++) {
            const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}?verify=${Date.now()}`;
            const response = await fetch(url);
            if (response.ok) {
              const metadata = await response.json();
              if (metadata.name === name && metadata.version === version && metadata.dist?.integrity && metadata.dist?.tarball) {
                console.log(`Verified public npm package ${name}@${version}`);
                process.exit(0);
              }
            }
            console.log(`Registry verification attempt ${attempt}/12: HTTP ${response.status}`);
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error(`Published package ${name}@${version} is not publicly available`);
          NODE
